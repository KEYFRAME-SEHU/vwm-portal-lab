<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d18" />
    <title>VWM Portal Lab 01: Six Worlds</title>
    <style>
      html, body, #scene-container {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #090d18;
        font-family: Arial, Helvetica, sans-serif;
      }
      #scene-container { position: fixed; inset: 0; }
      #hud {
        position: fixed;
        z-index: 10;
        left: 20px;
        top: 20px;
        max-width: 390px;
        padding: 16px 18px;
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 14px;
        color: white;
        background: rgba(5,9,18,0.78);
        backdrop-filter: blur(10px);
        line-height: 1.35;
      }
      #hud h1 { margin: 0 0 6px; font-size: 18px; }
      #hud p { margin: 6px 0; font-size: 13px; color: #d6d9e0; }
      #enter-xr {
        margin-top: 10px;
        border: 0;
        border-radius: 10px;
        padding: 11px 16px;
        font-weight: 700;
        cursor: pointer;
      }
      #status { font-size: 12px; opacity: 0.8; }
      #fade {
        pointer-events: none;
        position: fixed;
        z-index: 100;
        inset: 0;
        background: black;
        opacity: 0;
        transition: opacity 220ms ease;
      }
      body.portal-jump #fade { opacity: 1; }
      @media (max-width: 650px) {
        #hud { left: 10px; right: 10px; top: 10px; max-width: none; }
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="hud">
      <h1>Virtual Worlds Museum — Portal Lab 01</h1>
      <p>Six glowing oval portals, one circular holodeck. Enter VR, use the left thumbstick to move and the right thumbstick to turn. Walk directly into a portal's plasma to open its destination.</p>
      <button id="enter-xr">ENTER VR</button>
      <p id="status">Ready.</p>
    </div>
    <div id="fade"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
